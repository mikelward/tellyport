# Lane-classification policy for the shared mikelward/lanes engine.
#
# Ordered: the FIRST matching rule wins, and anything matching no rule is
# code. The :app module tree is a build input whatever the extension, so it
# stays code. dev-docs/ rides docs whole; markdown anywhere else rides docs
# too; everything else stays code.
code app/**
docs dev-docs/**
docs **/*.md

# Commit-subject conventions for housekeeping commits (see AGENTS.md).
# Every commit riding the docs lane must carry one.
prefixes ci docs internal refactor test tests

lint-title no
push classify
dispatch-without-pr refuse
